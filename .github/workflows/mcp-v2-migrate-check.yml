name: MCP SDK v2 validation

on:
  push:
    branches:
      - chore/mcp-sdk-v2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build and run characterization regression
        run: npm test

      - name: Check migration leftovers
        run: |
          if grep -R -n '@mcp-codemod-error' src test package.json; then
            echo "codemod left action-required diagnostics"
            exit 1
          fi
          if grep -R -n '@modelcontextprotocol/sdk' src test package.json; then
            echo "v1 SDK reference remains"
            exit 1
          fi
